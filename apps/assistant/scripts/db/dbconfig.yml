# The assistant shares auth's database but keeps its own schema and migration table.
development:
  dialect: postgres
  datasource: postgres://cka_sim:cka_sim@127.0.0.1:5434/cka_sim?sslmode=disable
  dir: migrations
  table: docs_migrations

production:
  dialect: postgres
  datasource: ${DATABASE_URL}
  dir: migrations
  table: docs_migrations
