apiVersion: v1
kind: ServiceAccount
metadata:
  name: cka-sim-auth
  annotations:
    iam.gke.io/gcp-service-account: ${AUTH_GSA}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cka-sim-auth
  template:
    metadata:
      labels:
        app: cka-sim-auth
    spec:
      serviceAccountName: cka-sim-auth
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      enableServiceLinks: false
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4
          restartPolicy: Always
          args:
            - --port=5432
            - --health-check
            - --http-address=0.0.0.0
            - ${INSTANCE}
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
        - name: migrate
          image: ${AUTH_IMAGE}
          command: [sh, -c, sql-migrate up -env=production && sql-migrate up -env=production_seeds]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cka-sim-db
                  key: url
      containers:
        - name: auth
          image: ${AUTH_IMAGE}
          env:
            - name: CKA_SIM_AUTH_ADDR
              value: ":7272"
            - name: CKA_SIM_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cka-sim-auth
                  key: secret
            - name: CKA_SIM_AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cka-sim-db
                  key: url
          ports:
            - containerPort: 7272
          readinessProbe:
            tcpSocket:
              port: 7272
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: cka-sim-auth
  ports:
    - port: 7272
