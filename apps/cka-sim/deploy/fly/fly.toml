# The site. The exam VMs live in a separate app, filled by pool.sh.
app = "cka-sim-maljoke"
primary_region = "gru"

[env]
  CKA_SIM_PROVIDER = "fly"
  FLY_LABS_APP = "cka-sim-labs-maljoke"

[http_service]
  internal_port = 8080
  force_https = true
  # One always-on server: it holds the running exam and its claimed VM in memory.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
