syntax = "proto3";

package assistant.v1;

option go_package = "github.com/MohamedAljoke/cka-sim/apps/go-shared/contract/assistant/v1;assistantv1";

// AssistantService is served by the assistant and called by the platform for a student it has already
// identified. Every call needs "Authorization: Bearer <token>"; a wrong or missing token fails with
// UNAUTHENTICATED.
service AssistantService {
  // Chat answers the last message of a conversation as a stream of events: the tools the tutor uses as it
  // uses them, and its answer in pieces. The stream ends when the answer is complete. INVALID_ARGUMENT for a
  // conversation that doesn't end with the student's message.
  rpc Chat(ChatRequest) returns (stream ChatResponse);
  // OpenClaude runs Claude Code in a terminal for a student, where the assistant runs and on its login, with no
  // tools but the tutor's MCP tools for that student. The first request names the student and the terminal's
  // size; after it, requests carry keystrokes or a new size and responses carry the terminal's output. The
  // stream ends when Claude Code exits. INVALID_ARGUMENT when the first request isn't a start with a student and
  // a size, FAILED_PRECONDITION when Claude Code isn't installed where the assistant runs.
  rpc OpenClaude(stream OpenClaudeRequest) returns (stream OpenClaudeResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_STUDENT = 1;
  ROLE_TUTOR = 2;
}

message Message {
  Role role = 1;
  string text = 2;
}

message ChatRequest {
  string student = 1;
  // The task open in the student's page, which may not be the one set up on their cluster.
  string task_id = 2;
  // The whole conversation so far, oldest first, ending with the student's message. The assistant keeps none.
  repeated Message messages = 3;
}

message ChatResponse {
  oneof event {
    // The next piece of the answer.
    string text = 1;
    // The tool the tutor is using, like "inspect_cluster".
    string tool = 2;
  }
}

message OpenClaudeRequest {
  oneof input {
    ClaudeStart start = 1;
    TerminalSize size = 2;
    bytes keys = 3;
  }
}

message ClaudeStart {
  string student = 1;
  TerminalSize size = 2;
}

message TerminalSize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message OpenClaudeResponse {
  bytes output = 1;
}
