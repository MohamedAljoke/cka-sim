apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.cka-sim.io
spec:
  group: cka-sim.io
  scope: Namespaced
  names:
    kind: WebApp
    plural: webapps
    singular: webapp
    shortNames: [wa]
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - {name: Image, type: string, jsonPath: .spec.image}
    - {name: Replicas, type: integer, jsonPath: .spec.replicas}
    - {name: Ready, type: integer, jsonPath: .status.readyReplicas}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [image]
            properties:
              image:
                type: string
              replicas:
                type: integer
                minimum: 0
                default: 1
              port:
                type: integer
                default: 80
          status:
            type: object
            properties:
              readyReplicas:
                type: integer
---
apiVersion: v1
kind: Namespace
metadata:
  name: web-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-operator
  namespace: web-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: web-operator
rules:
- apiGroups: [cka-sim.io]
  resources: [webapps]
  verbs: [get, list, watch]
- apiGroups: [cka-sim.io]
  resources: [webapps/status]
  verbs: [get, patch, update]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch, create, patch, update]
- apiGroups: [""]
  resources: [services]
  verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: web-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: web-operator
subjects:
- kind: ServiceAccount
  name: web-operator
  namespace: web-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-operator
  namespace: web-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-operator
  template:
    metadata:
      labels:
        app: web-operator
    spec:
      serviceAccountName: web-operator
      containers:
      - name: operator
        image: cka-sim/web-operator:1.0
        imagePullPolicy: IfNotPresent
