# The main app on the shared platform pool. It may only claim labs and read their pods' addresses.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cka-sim-app
  annotations:
    iam.gke.io/gcp-service-account: ${APP_GSA}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cka-sim-app
rules:
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cka-sim-app
subjects:
  - kind: ServiceAccount
    name: cka-sim-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cka-sim-app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  # One server holds every user's lab and exam in memory, so never two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cka-sim-app
  template:
    metadata:
      labels:
        app: cka-sim-app
    spec:
      serviceAccountName: cka-sim-app
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      enableServiceLinks: false
      volumes:
        - name: caddy-data
          persistentVolumeClaim:
            claimName: caddy-data
      containers:
        - name: app
          image: ${APP_IMAGE}
          env:
            - name: CKA_SIM_PROVIDER
              value: gke
            - name: CKA_SIM_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cka-sim-agent
                  key: token
            - name: SITE_HOST
              value: ${SITE_HOST}
            - name: CKA_SIM_AUTH_URL
              value: http://auth:7272
            # The lab reaches no private address, so Claude Code in it comes back through the public site.
            - name: CKA_SIM_MCP_URL
              value: https://${SITE_HOST}/mcp
            - name: CKA_SIM_LLM
              value: vertex
            - name: CKA_SIM_VERTEX_PROJECT
              value: ${PROJECT}
            - name: CKA_SIM_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cka-sim-auth
                  key: secret
          volumeMounts:
            - name: caddy-data
              mountPath: /root/.local/share/caddy
          ports:
            - containerPort: 80
            - containerPort: 443
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        - name: mcp
          image: ${MCP_IMAGE}
          env:
            - name: CKA_SIM_MCP_ADDR
              value: 127.0.0.1:7373
            - name: CKA_SIM_PLATFORM_URL
              value: http://127.0.0.1:7070
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: site
spec:
  type: LoadBalancer
  loadBalancerIP: ${SITE_IP}
  selector:
    app: cka-sim-app
  ports:
    - name: http
      port: 80
    - name: https
      port: 443
