<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cka-sim</title>
    <script>
      try {
        // No saved choice: style.css follows the OS, like the DSA guide.
        const stored = localStorage.getItem('cka-sim:color-scheme')
        if (stored === 'light' || stored === 'dark') document.documentElement.dataset.theme = stored
      } catch {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <span class="brand"><span class="brand-mark" aria-hidden="true">◆</span>cka-sim</span>
      <div class="topbar-end">
        <div class="lab" id="lab"></div>
        <button class="icon-btn" id="theme" type="button"></button>
      </div>
    </header>
    <main class="exam single">
      <section class="question" id="question"></section>
      <section class="terminal" id="terminal"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
