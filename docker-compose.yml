# Postgres for the auth server. `make db` starts it and applies the migrations and seeds.
name: cka-sim

services:
  postgres:
    image: postgres:16-alpine
    container_name: cka-sim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cka_sim
      POSTGRES_PASSWORD: cka_sim
      POSTGRES_DB: cka_sim
    # 5434, so it runs next to other projects' Postgres on 5432 and 5433.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cka_sim -d cka_sim"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
