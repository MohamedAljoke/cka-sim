<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" role="img" aria-label="The assistant in five parts: the tools, the tutor in the page, the AI, evals, and the Kubernetes docs, each built on the one before" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; font-size: 11.5px; }
    .label { fill: #59636e; font-size: 11px; }
    .edge { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .head { fill: #8c959f; }
    .node { fill: #0969da; fill-opacity: 0.12; stroke: #0969da; stroke-width: 2; }
    .ai { fill: #8250df; fill-opacity: 0.12; stroke: #8250df; stroke-width: 2; }
    .base { fill: #1a7f37; fill-opacity: 0.12; stroke: #1a7f37; stroke-width: 2; }
    .b { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .quiet, .label { fill: #9198a1; }
      .edge { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .node { fill: #4493f8; stroke: #4493f8; }
      .ai { fill: #ab7df8; stroke: #ab7df8; }
      .base { fill: #3fb950; stroke: #3fb950; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="ink b" x="24" y="34" font-size="15">Five parts, each reviewed before the next</text>

  <rect class="node" x="24" y="60" width="148" height="112" rx="8"/>
  <text class="label" x="38" y="82">PART 1</text>
  <text class="ink b" x="38" y="102">The tools</text>
  <text class="quiet" x="38" y="124">TutorService on the</text>
  <text class="quiet" x="38" y="140">platform; an MCP server</text>
  <text class="quiet" x="38" y="156">in apps/assistant</text>

  <path class="edge" d="M172 116H192" marker-end="url(#arrow)"/>

  <rect class="node" x="194" y="60" width="148" height="112" rx="8"/>
  <text class="label" x="208" y="82">PART 2</text>
  <text class="ink b" x="208" y="102">The tutor in the page</text>
  <text class="quiet" x="208" y="124">chat panel → platform</text>
  <text class="quiet" x="208" y="140">→ the assistant, with</text>
  <text class="quiet" x="208" y="156">a stand-in answering</text>

  <path class="edge" d="M342 116H362" marker-end="url(#arrow)"/>

  <rect class="ai" x="364" y="60" width="148" height="112" rx="8"/>
  <text class="label" x="378" y="82">PART 3</text>
  <text class="ink b" x="378" y="102">The AI</text>
  <text class="quiet" x="378" y="124">a Gemini loop over</text>
  <text class="quiet" x="378" y="140">the same MCP tools,</text>
  <text class="quiet" x="378" y="156">replacing the stand-in</text>

  <path class="edge" d="M512 116H532" marker-end="url(#arrow)"/>

  <rect class="ai" x="534" y="60" width="148" height="112" rx="8"/>
  <text class="label" x="548" y="82">PART 4</text>
  <text class="ink b" x="548" y="102">Evals</text>
  <text class="quiet" x="548" y="124">break a task, ask;</text>
  <text class="quiet" x="548" y="140">solve it, ask again;</text>
  <text class="quiet" x="548" y="156">a model judges both</text>

  <path class="edge" d="M682 116H702" marker-end="url(#arrow)"/>

  <rect class="base" x="704" y="60" width="152" height="112" rx="8"/>
  <text class="label" x="718" y="82">PART 5</text>
  <text class="ink b" x="718" y="102">The Kubernetes docs</text>
  <text class="quiet" x="718" y="124">search_docs over the</text>
  <text class="quiet" x="718" y="140">kubernetes.io pages,</text>
  <text class="quiet" x="718" y="156">embedded with Ollama</text>

  <text class="quiet" x="24" y="196">Blue: plumbing a model never sees. Purple: the model and how it's measured. Green: what it can look up.</text>
</svg>
