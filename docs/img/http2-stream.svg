<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" role="img" aria-label="OpenShell is one HTTP/2 stream in which the platform keeps sending keys while the agent keeps sending output" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; font-size: 11.5px; }
    .label { fill: #1f2328; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .edge { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .life { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 3 4; }
    .head { fill: #8c959f; }
    .node { fill: #0969da; fill-opacity: 0.12; stroke: #0969da; stroke-width: 2; }
    .b { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .ink, .label { fill: #e6edf3; }
      .quiet { fill: #9198a1; }
      .edge, .life { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .node { fill: #4493f8; stroke: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="ink b" x="24" y="34" font-size="15">OpenShell: one HTTP/2 stream, both bodies open at once</text>

  <rect class="edge" x="120" y="56" width="160" height="36" rx="8"/>
  <text class="ink b" x="200" y="79" text-anchor="middle">Platform</text>
  <rect class="edge" x="480" y="56" width="160" height="36" rx="8"/>
  <text class="ink b" x="560" y="79" text-anchor="middle">Agent</text>
  <path class="life" d="M200 92V340"/>
  <path class="life" d="M560 92V340"/>

  <text class="label" x="380" y="114" text-anchor="middle">HEADERS  POST …/OpenShell, Authorization</text>
  <path class="edge" d="M200 122H556" marker-end="url(#arrow)"/>
  <text class="label" x="380" y="144" text-anchor="middle">HEADERS  200</text>
  <path class="edge" d="M560 152H204" marker-end="url(#arrow)"/>
  <text class="label" x="380" y="174" text-anchor="middle">DATA  size 120×40</text>
  <path class="edge" d="M200 182H556" marker-end="url(#arrow)"/>
  <text class="label" x="380" y="204" text-anchor="middle">DATA  output "root@…:~# "</text>
  <path class="edge" d="M560 212H204" marker-end="url(#arrow)"/>
  <text class="label" x="380" y="234" text-anchor="middle">DATA  keys "l"</text>
  <path class="edge" d="M200 242H556" marker-end="url(#arrow)"/>
  <text class="label" x="380" y="264" text-anchor="middle">DATA  output "l"</text>
  <path class="edge" d="M560 272H204" marker-end="url(#arrow)"/>
  <text class="quiet" x="380" y="296" text-anchor="middle">… as long as the terminal is open …</text>
  <text class="label" x="380" y="320" text-anchor="middle">end of stream, with the status</text>
  <path class="edge" d="M560 328H204" marker-end="url(#arrow)"/>

  <text class="ink b" x="24" y="376">Inside every DATA frame: one Connect envelope</text>
  <rect class="node" x="24" y="390" width="96" height="36" rx="4"/>
  <rect class="node" x="120" y="390" width="112" height="36" rx="4"/>
  <rect class="edge" x="232" y="390" width="280" height="36" rx="4"/>
  <text class="ink" x="72" y="413" text-anchor="middle" font-size="11.5">flags, 1 byte</text>
  <text class="ink" x="176" y="413" text-anchor="middle" font-size="11.5">length, 4 bytes</text>
  <text class="ink" x="372" y="413" text-anchor="middle" font-size="11.5">protobuf message</text>
  <text class="quiet" x="532" y="404">so Receive() always</text>
  <text class="quiet" x="532" y="420">returns one whole message</text>
</svg>
