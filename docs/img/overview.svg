<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="The browser talks to the app, the app to the lab's agent, and the agent runs a kind cluster and a base host on its own Docker" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; font-size: 11.5px; }
    .label { fill: #59636e; font-size: 11px; }
    .edge { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .head { fill: #8c959f; }
    .node { fill: #0969da; fill-opacity: 0.12; stroke: #0969da; stroke-width: 2; }
    .base { fill: #1a7f37; fill-opacity: 0.12; stroke: #1a7f37; stroke-width: 2; }
    .b { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .quiet, .label { fill: #9198a1; }
      .edge { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .node { fill: #4493f8; stroke: #4493f8; }
      .base { fill: #3fb950; stroke: #3fb950; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="ink b" x="24" y="34" font-size="15">A real cluster per lab, reached through one small contract</text>

  <rect class="edge" x="24" y="90" width="114" height="120" rx="8"/>
  <text class="ink b" x="81" y="118" text-anchor="middle">Browser</text>
  <text class="quiet" x="81" y="142" text-anchor="middle">task page</text>
  <text class="quiet" x="81" y="160" text-anchor="middle">exam mode</text>
  <text class="quiet" x="81" y="178" text-anchor="middle">xterm.js terminal</text>

  <path class="edge" d="M138 150H208" marker-end="url(#arrow)"/>
  <text class="label" x="173" y="142" text-anchor="middle">HTTPS</text>
  <text class="label" x="173" y="166" text-anchor="middle">WebSocket</text>

  <rect class="edge" x="210" y="90" width="146" height="120" rx="8"/>
  <text class="ink b" x="283" y="118" text-anchor="middle">App</text>
  <text class="quiet" x="283" y="142" text-anchor="middle">page, platform, Caddy</text>
  <text class="quiet" x="283" y="160" text-anchor="middle">203 tasks, grading</text>
  <text class="quiet" x="283" y="178" text-anchor="middle">exam, heal and tidy</text>

  <path class="edge" d="M356 120H470" marker-end="url(#arrow)"/>
  <text class="label" x="404" y="112" text-anchor="middle">Connect</text>
  <text class="label" x="404" y="136" text-anchor="middle">HTTP/2, token</text>

  <rect class="edge" x="452" y="56" width="288" height="300" rx="8" stroke-dasharray="4 4"/>
  <text class="ink b" x="468" y="78">Lab</text>
  <text class="quiet" x="498" y="78">privileged, Docker in Docker</text>

  <rect class="edge" x="472" y="92" width="252" height="54" rx="8"/>
  <text class="ink b" x="598" y="114" text-anchor="middle">Agent :7171</text>
  <text class="quiet" x="598" y="132" text-anchor="middle">builds the cluster, opens shells, runs scripts</text>

  <path class="edge" d="M598 146V170" marker-end="url(#arrow)"/>

  <rect class="edge" x="462" y="172" width="270" height="172" rx="8" stroke-dasharray="2 3"/>
  <text class="quiet" x="474" y="190">the lab's own dockerd</text>

  <rect class="base" x="472" y="200" width="252" height="44" rx="8"/>
  <text class="ink b" x="598" y="219" text-anchor="middle">base host</text>
  <text class="quiet" x="598" y="235" text-anchor="middle">every terminal, as candidate, no kubectl</text>

  <path class="edge" d="M509 244V270" marker-end="url(#arrow)"/>
  <path class="edge" d="M598 244V270" marker-end="url(#arrow)"/>
  <path class="edge" d="M687 244V270" marker-end="url(#arrow)"/>
  <text class="label" x="614" y="262">ssh</text>

  <rect class="node" x="472" y="272" width="74" height="60" rx="8"/>
  <text class="ink b" x="509" y="296" text-anchor="middle">control</text>
  <text class="ink b" x="509" y="312" text-anchor="middle">plane</text>
  <rect class="node" x="561" y="272" width="74" height="60" rx="8"/>
  <text class="ink b" x="598" y="304" text-anchor="middle">worker</text>
  <rect class="node" x="650" y="272" width="74" height="60" rx="8"/>
  <text class="ink b" x="687" y="304" text-anchor="middle">worker</text>

  <text class="quiet" x="440" y="296" text-anchor="end">kind nodes: a real kubeadm cluster,</text>
  <text class="quiet" x="440" y="312" text-anchor="end">etcd and kubelets you can break</text>

  <text class="ink b" x="24" y="392">Where the lab runs</text>
  <text class="quiet" x="24" y="412">Locally: one container next to the app. On Kubernetes (GKE): a pod the platform creates on Start lab,</text>
  <text class="quiet" x="24" y="428">alone on a node from a pool that scales from zero. The platform only knows the agent's contract.</text>
</svg>
