<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="On the agent, one goroutine feeds the caller's keys and sizes into the pty, and the handler sends the pty's output back; either one ending ends the other" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; font-size: 11.5px; }
    .label { fill: #59636e; font-size: 11px; }
    .edge { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .head { fill: #8c959f; }
    .node { fill: #0969da; fill-opacity: 0.12; stroke: #0969da; stroke-width: 2; }
    .b { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .quiet, .label { fill: #9198a1; }
      .edge { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .node { fill: #4493f8; stroke: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="ink b" x="24" y="34" font-size="15">On the agent: one goroutine per direction</text>

  <rect class="edge" x="24" y="64" width="140" height="160" rx="8"/>
  <text class="ink b" x="94" y="140" text-anchor="middle">caller</text>
  <text class="quiet" x="94" y="158" text-anchor="middle">the platform</text>

  <rect class="node" x="596" y="64" width="140" height="160" rx="8"/>
  <text class="ink b" x="666" y="140" text-anchor="middle">pty</text>
  <text class="quiet" x="666" y="158" text-anchor="middle">bash in the node</text>

  <rect class="edge" x="280" y="72" width="200" height="56" rx="8"/>
  <text class="ink b" x="380" y="95" text-anchor="middle">feed()</text>
  <text class="quiet" x="380" y="113" text-anchor="middle">caller hung up → Close</text>

  <rect class="edge" x="280" y="160" width="200" height="56" rx="8"/>
  <text class="ink b" x="380" y="183" text-anchor="middle">handler loop</text>
  <text class="quiet" x="380" y="201" text-anchor="middle">bash exited → return</text>

  <path class="edge" d="M168 100H276" marker-end="url(#arrow)"/>
  <text class="label" x="222" y="92" text-anchor="middle">Receive</text>
  <path class="edge" d="M484 100H592" marker-end="url(#arrow)"/>
  <text class="label" x="538" y="92" text-anchor="middle">Write / Resize</text>
  <path class="edge" d="M592 188H484" marker-end="url(#arrow)"/>
  <text class="label" x="538" y="180" text-anchor="middle">Read</text>
  <path class="edge" d="M276 188H168" marker-end="url(#arrow)"/>
  <text class="label" x="222" y="180" text-anchor="middle">Send</text>

  <text class="quiet" x="24" y="258">Either end stops the other: Close makes the handler's Read fail, and the handler returning makes feed's Receive fail.</text>
  <text class="quiet" x="24" y="276">So Close runs twice, and sync.Once makes the second call a no-op.</text>
</svg>
