<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" role="img" aria-label="A keystroke travels from the browser to bash on the base host, and bash's echo comes back" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; font-size: 11.5px; }
    .label { fill: #59636e; font-size: 11px; }
    .edge { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .head { fill: #8c959f; }
    .node { fill: #0969da; fill-opacity: 0.12; stroke: #0969da; stroke-width: 2; }
    .b { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .quiet, .label { fill: #9198a1; }
      .edge { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .node { fill: #4493f8; stroke: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="ink b" x="24" y="34" font-size="15">One keystroke, from the browser to bash on the base host and back</text>

  <rect class="edge" x="21" y="64" width="186" height="84" rx="8"/>
  <text class="ink b" x="114" y="90" text-anchor="middle">Browser</text>
  <text class="quiet" x="114" y="108" text-anchor="middle">xterm.js draws the output</text>
  <text class="quiet" x="114" y="124" text-anchor="middle">never echoes keys itself</text>

  <rect class="edge" x="287" y="64" width="186" height="84" rx="8"/>
  <text class="ink b" x="380" y="90" text-anchor="middle">Platform</text>
  <text class="quiet" x="380" y="108" text-anchor="middle">WebSocket ⇄ OpenShell</text>
  <text class="quiet" x="380" y="124" text-anchor="middle">checks the origin</text>

  <rect class="edge" x="553" y="64" width="186" height="84" rx="8"/>
  <text class="ink b" x="646" y="90" text-anchor="middle">Agent</text>
  <text class="quiet" x="646" y="108" text-anchor="middle">holds the pty master</text>
  <text class="quiet" x="646" y="124" text-anchor="middle">one goroutine per direction</text>

  <rect class="edge" x="553" y="228" width="186" height="84" rx="8"/>
  <text class="ink b" x="646" y="254" text-anchor="middle">docker exec -it</text>
  <text class="quiet" x="646" y="272" text-anchor="middle">on the pty slave, raw mode</text>
  <text class="quiet" x="646" y="288" text-anchor="middle">SIGWINCH → resize base's tty</text>

  <rect class="edge" x="287" y="228" width="186" height="84" rx="8"/>
  <text class="ink b" x="380" y="254" text-anchor="middle">inner dockerd</text>
  <text class="quiet" x="380" y="272" text-anchor="middle">Unix socket only</text>
  <text class="quiet" x="380" y="288" text-anchor="middle">creates base's tty (-t)</text>

  <rect class="node" x="21" y="228" width="186" height="84" rx="8"/>
  <text class="ink b" x="114" y="254" text-anchor="middle">bash on base</text>
  <text class="quiet" x="114" y="272" text-anchor="middle">readline, echo, Ctrl-C</text>
  <text class="quiet" x="114" y="288" text-anchor="middle">as candidate; ssh to a node</text>

  <path class="edge" d="M211 106H283" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="247" y="98" text-anchor="middle">WebSocket</text>
  <path class="edge" d="M477 106H549" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="513" y="98" text-anchor="middle">HTTP/2 stream</text>
  <path class="edge" d="M646 152V224" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="656" y="192">pty</text>
  <path class="edge" d="M477 270H549" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="513" y="262" text-anchor="middle">exec API</text>
  <path class="edge" d="M211 270H283" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="247" y="262" text-anchor="middle">base's tty</text>

  <text class="quiet" x="24" y="352">Every character you see, even a space, is bash's echo coming back up the chain.</text>
  <text class="quiet" x="24" y="370">A resize follows the same path down, so vim and top redraw at the browser panel's size.</text>
  <text class="quiet" x="24" y="388">Closing a shell kills the CLI, then HUPs and KILLs every process on base tagged with that shell's id.</text>
</svg>
