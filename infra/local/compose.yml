# cka-sim on one machine with only Docker: the page, auth and a lab. `cka-sim up` runs it; from a clone,
# `make try` builds the images from source instead of pulling them.
name: cka-sim-local

services:
  secrets:
    image: alpine:3.22
    volumes:
      - secrets:/secrets
    command:
      - sh
      - -c
      - |
        umask 077
        for f in agent-token auth-secret; do
          [ -s /secrets/$$f ] || od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > /secrets/$$f
        done

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cka_sim
      POSTGRES_PASSWORD: cka_sim
      POSTGRES_DB: cka_sim
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cka_sim -d cka_sim"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  lab:
    container_name: cka-sim-lab
    image: ghcr.io/mohamedaljoke/cka-sim-lab:${CKA_SIM_VERSION:-latest}
    build:
      context: ../../apps
      dockerfile: lab/deploy/lab.Dockerfile
    restart: unless-stopped
    privileged: true
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      # Keep in step with apps/platform/catalog/images.txt.
      CKA_SIM_IMAGES: busybox:1.36,nginx:1.26-alpine,nginx:1.27,nginx:1.27-alpine
    volumes:
      - secrets:/secrets:ro
      - lab-docker:/var/lib/docker
      - /lib/modules:/lib/modules:ro
    entrypoint:
      - sh
      - -c
      - export CKA_SIM_AGENT_TOKEN="$$(cat /secrets/agent-token)"; exec /lab-start.sh
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7171/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 15m

  auth:
    image: ghcr.io/mohamedaljoke/cka-sim-auth:${CKA_SIM_VERSION:-latest}
    build:
      context: ../../apps
      dockerfile: auth/deploy/auth.Dockerfile
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      CKA_SIM_AUTH_ADDR: ":7272"
      DATABASE_URL: &db postgres://cka_sim:cka_sim@postgres:5432/cka_sim?sslmode=disable
      CKA_SIM_AUTH_DATABASE_URL: *db
    volumes:
      - secrets:/secrets:ro
    entrypoint:
      - sh
      - -c
      - |
        export CKA_SIM_AUTH_SECRET="$$(cat /secrets/auth-secret)"
        sql-migrate up -env=production && sql-migrate up -env=production_seeds && exec cka-sim-auth

  app:
    image: ghcr.io/mohamedaljoke/cka-sim-app:${CKA_SIM_VERSION:-latest}
    build:
      context: ../../apps
      dockerfile: platform/deploy/app.Dockerfile
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      lab:
        condition: service_healthy
    environment:
      SITE_HOST: ":80"
      CKA_SIM_LAB_URL: http://lab:7171
      CKA_SIM_AUTH_URL: http://auth:7272
      # The base host runs in the lab's own Docker, which cannot resolve compose names.
      CKA_SIM_MCP_URL: http://10.237.73.10:7373/mcp
    volumes:
      - secrets:/secrets:ro
      - exams:/root/.local/state/cka-sim
    ports:
      - "127.0.0.1:${CKA_SIM_PORT:-7080}:80"
    entrypoint:
      - sh
      - -c
      - |
        export CKA_SIM_AGENT_TOKEN="$$(cat /secrets/agent-token)" CKA_SIM_AUTH_SECRET="$$(cat /secrets/auth-secret)"
        exec /app-start.sh
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 2s
      timeout: 3s
      retries: 30

  mcp:
    image: ghcr.io/mohamedaljoke/cka-sim-mcp:${CKA_SIM_VERSION:-latest}
    build:
      context: ../../apps
      dockerfile: mcp/deploy/mcp.Dockerfile
    restart: unless-stopped
    environment:
      CKA_SIM_MCP_ADDR: ":7373"
      CKA_SIM_PLATFORM_URL: http://app
    networks:
      default:
        ipv4_address: 10.237.73.10

networks:
  default:
    ipam:
      config:
        - subnet: 10.237.73.0/24

volumes:
  secrets:
  postgres:
  lab-docker:
  exams:
